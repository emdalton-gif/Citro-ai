<meta charset="UTF-8">

<title>Starting Your Trial — Citro</title>

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --dark:   #07202B;
  --accent: #00BDE7;
  --green:  #026F8B;
  --mid:    #48626E;
  --ink:    #07202B;
  --bg:     #F2F8FA;
  --sans:   'Inter', system-ui, sans-serif;
      --display:     'Archivo', 'Inter', system-ui, sans-serif;
      --on-accent:   #04222E;
      --accent-soft: #8FE3F6;
      --accent-d2:   #026F8B;
}
html, body { height: 100%; }
    h1, h2, h3, h4, h5, h6 { font-family: var(--display); letter-spacing: -0.025em; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0;
  background: var(--dark); height: 60px; padding: 0 48px;
  display: flex; align-items: center;
}
.nav-logo-text { font-size: 18px; font-weight: 800; color: var(--accent); letter-spacing: -0.3px; }

/* ── CARD ── */
.card {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.07);
  padding: 56px 48px;
  max-width: 480px;
  width: 90%;
  text-align: center;
}

/* ── SPINNER ── */
.spinner {
  width: 48px; height: 48px;
  border: 4px solid #D7E7ED;
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.85s linear infinite;
  margin: 0 auto 28px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── STATUS ── */
#status-icon { display: none; margin: 0 auto 24px; }
.icon-success { color: var(--green); }
.icon-error   { color: #E8452A; }

h1 { font-size: 22px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
.sub { font-size: 15px; color: var(--mid); line-height: 1.55; }

/* ── STEPS ── */
.steps {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 28px;
  text-align: left;
}
.step {
  display: flex; align-items: center; gap: 12px;
  font-size: 14px; color: var(--mid); font-weight: 500;
}
.step .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #B9D2DB; flex-shrink: 0; transition: background 0.3s;
}
.step.done .dot  { background: var(--green); }
.step.active .dot { background: var(--accent); animation: pulse 1s ease infinite; }
.step.done span  { color: var(--ink); }
.step.active span { color: var(--accent); }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.4; }
}

/* ── ERROR CTA ── */
.btn-retry {
  display: inline-block; margin-top: 28px;
  background:var(--accent);color:#04222E;
  padding: 12px 28px; border-radius: 999px;
  font-size: 15px; font-weight: 600;
  text-decoration: none;
}
    /* dark ink on any surface filled with the accent */
    .step.active .dot, .step.active .dot * { color: #04222E; }
    /* --- contrast corrections ------------------------------------------- */
    /* accent-coloured links sit on light grounds; use the darker accent */
    .diff-intro a, .signin-link a, .new-link a, .rp-cta-row a,
    .article-wrap a, .lead a, .body-copy a { color: var(--accent-d2); }
    /* anything FILLED with the accent takes dark ink, children included */
    .cta-block, .cta-block *, .hero-cta, .hero-cta *, .btn-primary, .btn-primary *,
    .btn, .btn *, .stepnum, .stepnum *, .step-num, .step-num *,
    .verdict-cta, .verdict-cta *, .ra-btn-accept, .ra-save-btn { color: #04222E; }
    /* the deficit glyph was a shade light against white */
    .cross { color: #C63A22; }
    /* --- final contrast pass --------------------------------------------- */
    /* element selectors inside an accent-filled block out-specify ".block *" */
    .cta-block h2, .cta-block h3, .cta-block h4, .cta-block p, .cta-block a,
    .hero-cta h3, .hero-cta p { color: #04222E; }
    /* small accent labels that the first sweep missed */
    .card-eyebrow, .gi-n, .unlock-note, .stat-cap { color: var(--accent-d2); }
    /* deficit figures need to clear 3:1 against white */
    .rp-score-pct, .rp-hbar-name, .rp-comp-you { color: #E8452A; }
    /* the cookie banner sits on a dark ground; its muted text needs to be light */
    .ra-btn-reject, #ra-cb .ra-cb-text, #ra-cb small, #ra-modal .ra-muted { color: #B9D2DB; }
    .rp-brand-tag { color: var(--accent-d2); }




</style>

<body>

<nav>
  <a href="/" style="text-decoration:none;">
    <span class="nav-logo-text">Citro</span>
  </a>
</nav>

<div class="card">
  <!-- Spinner (shown during activation) -->
  <div class="spinner" id="spinner"></div>

  <!-- Status icon (shown after) -->
  <div id="status-icon">
    <!-- success -->
    <svg id="icon-success" class="icon-success" style="display:none;" width="52" height="52" fill="none" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="26" fill="rgba(2,111,139,0.1)"/>
      <path d="M16 26l8 8 12-14" stroke="#026F8B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <!-- error -->
    <svg id="icon-error" class="icon-error" style="display:none;" width="52" height="52" fill="none" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="26" fill="rgba(232,69,42,0.08)"/>
      <path d="M18 18l16 16M34 18L18 34" stroke="#E8452A" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>

  <h1 id="heading">Starting your free trial…</h1>
  <p class="sub" id="subheading">Hang on while we set up your Citro account.</p>

  <!-- Progress steps -->
  <div class="steps" id="steps">
    <div class="step" id="step-verify">
      <div class="dot"></div><span>Verifying payment</span>
    </div>
    <div class="step" id="step-account">
      <div class="dot"></div><span>Activating your account</span>
    </div>
    <div class="step" id="step-audit">
      <div class="dot"></div><span>Preparing your audit</span>
    </div>
  </div>

  <div id="error-cta" style="display:none;">
    <a href="/start.html" class="btn-retry">Back to signup</a>
  </div>
</div>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var sessionId = params.get('session_id');

  function setStep(id, state) {
    var el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('done', 'active');
    if (state) el.classList.add(state);
  }

  function showError(msg) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('status-icon').style.display = 'block';
    document.getElementById('icon-error').style.display = 'block';
    document.getElementById('steps').style.display = 'none';
    document.getElementById('heading').textContent = 'Something went wrong';
    document.getElementById('subheading').textContent = msg || 'We could not activate your account. Please contact support@getcitro.ai and we\'ll sort it out right away.';
    document.getElementById('error-cta').style.display = 'block';
  }

  function showSuccess() {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('status-icon').style.display = 'block';
    document.getElementById('icon-success').style.display = 'block';
    document.getElementById('steps').style.display = 'none';
    document.getElementById('heading').textContent = 'Your free trial has started!';
    document.getElementById('subheading').textContent = 'Running your first Citro audit now…';
  }

  async function activate() {
    if (!sessionId) {
      showError('No session ID found. Please try completing checkout again.');
      return;
    }

    // Step 1 — verify
    setStep('step-verify', 'active');
    var verifyResp, verifyData;
    try {
      verifyResp = await fetch('/api/trial-activate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId: sessionId }),
      });
      verifyData = await verifyResp.json();
    } catch (e) {
      showError('Network error during account activation. Please try refreshing.');
      return;
    }

    if (!verifyResp.ok || !verifyData.token) {
      showError(verifyData.error || 'Could not activate your account.');
      return;
    }

    setStep('step-verify', 'done');

    // Step 2 — store token (account now active)
    setStep('step-account', 'active');
    try {
      localStorage.setItem('sub_token', verifyData.token);
      localStorage.setItem('sub_email', verifyData.email || '');
    } catch (e) { /* localStorage blocked — non-fatal */ }

    setStep('step-account', 'done');

    // Step 3 — fire conversion event, then redirect
    setStep('step-audit', 'active');
    showSuccess();

    // Fire GA4 purchase event — deduplicated by sessionId.
    // Uses event_callback so we wait for the beacon to send before
    // navigating away. Fallback redirect fires after 3s regardless.
    var redirected = false;
    function doRedirect() {
      if (!redirected) {
        redirected = true;
        window.location.href = '/sub-audit.html';
      }
    }

    var fireKey = 'ra_trial_' + sessionId;
    try {
      if (!sessionStorage.getItem(fireKey) && typeof gtag === 'function') {
        sessionStorage.setItem(fireKey, '1');
        // Enhanced conversions: pass email (gtag hashes it client-side) for better match rates
        var ecEmail=''; try{ ecEmail=(typeof verifyData!=='undefined'&&verifyData.email)||localStorage.getItem('sub_email')||''; }catch(e){}
        if(ecEmail){ gtag('set','user_data',{email:ecEmail}); }
        // Google Ads conversion — Citro Trial Start (primary)
        gtag('event','conversion',{ send_to:'AW-18148918651/-7MyCNiSr7ccEPuKis5D', transaction_id: sessionId });
        gtag('event', 'purchase', {
          transaction_id: sessionId,
          value: 119.00,
          currency: 'USD',
          items: [{ item_id: 'professional_trial', item_name: 'Citro Professional Trial', price: 119.00, quantity: 1 }],
          event_callback: doRedirect  // redirect only after beacon is sent
        });
      }
    } catch(e) {}

    // Safety fallback — redirect after 3s even if gtag callback never fires
    setTimeout(doRedirect, 3000);
  }

  // Fire immediately
  activate();
})();
</script>
</body>
</html>
